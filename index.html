// Make approved requests authoritative: any participants listed on an approved
// request are automatically present in the Participants registry. This also
// repairs requests that were approved before the automatic-import feature was added.
function syncApprovedRequests(){
  let changed=false;
  (db.requests||[]).filter(r=>r.status==='Approved').forEach(r=>{
    let items=requestParticipants(r);
    let client=users.find(u=>u.id===r.clientId)||{};
    let registered=(r.created||new Date().toISOString()).slice(0,10);
    items.forEach(item=>{
      let rec=participantRecordFromRequest(item,r,client,registered);
      if(!rec.name)return;
      if((r.deletedParticipantKeys||[]).includes(participantSyncKey(rec)))return;
      let exists=db.participants.some(p=>
        (p.name||'').trim().toLowerCase()===rec.name.trim().toLowerCase() &&
        (p.company||'').trim().toLowerCase()===(rec.company||'').trim().toLowerCase()
      );
      if(exists){
        let existing=db.participants.find(p=>(p.name||'').trim().toLowerCase()===rec.name.trim().toLowerCase() && (p.company||'').trim().toLowerCase()===(rec.company||'').trim().toLowerCase());
        if(existing && rec.photo && !existing.photo){existing.photo=rec.photo;changed=true;}
      }else{
        rec.id=eid();
        rec.notes=`Added automatically from approved ${r.type||'service'} request${r.service?' — '+r.service:''}.`;
        rec.sourceRequestId=r.id;
        db.participants.push(rec);
        changed=true;
      }
    });
  });
  if(changed)queueCloudSave();
}

function previewEditedParticipantPhoto(input){
  let file=input.files?.[0];if(!file)return;
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){input.value='';return alert('Please upload a JPG, PNG, or WebP image.');}
  if(file.size>2*1024*1024){input.value='';return alert('Picture must be 2 MB or smaller.');}
  let reader=new FileReader();
  reader.onload=()=>{
    $('editParticipantPhotoPreview').src=reader.result;
    $('epExistingPhoto').value=reader.result;
  };
  reader.readAsDataURL(file);
}

    company:epCompany.value.trim(),
    position:epPosition.value.trim(),
    companyAddress:epCompanyAddress.value.trim(),
    region:epRegion.value.trim(),
    industry:epIndustry.value.trim(),
    companyEmail:epCompanyEmail.value.trim(),
    personalEmail:epPersonalEmail.value.trim(),
    personalMobile:epPersonalMobile.value.trim(),
    companyLandline:epCompanyLandline.value.trim(),
    registered:epRegistered.value,
    notes:epNotes.value.trim(),
    photo:epExistingPhoto.value||'',
  };
  p.name=participantFullName(p);
  p.contact=p.personalMobile;

  if(!p.name)return alert('Please complete the participant name.');
  if(id)db.participants=db.participants.map(x=>x.id==id?p:x);
  else db.participants.push(p);
  save();closeM();
}

ted':''}>Cancelled</option></select></div><div class="field full"><label>Remarks</label><textarea id="cr">${esc(c.remarks)}</textarea></div></div><div class="actions"><button type="button" class="btn gray" onclick="closeM()">Cancel</button><button class="btn primary">Save Certificate</button></div></form>`);
function updateCertNumberMode(){let manual=cnumMode.value==='manual';cn.readOnly=!manual;cn.required=true;if(manual){cn.placeholder='Enter certificate number';$('cnHelp').textContent='Enter the official certificate number manually.'}else{$('cnHelp').textContent='Automatically generated by service and year.';refreshCertificateNumber()}}
cnumMode.addEventListener('change',updateCertNumberMode);cservice.addEventListener('change',()=>{if(cnumMode.value==='auto')refreshCertificateNumber()});cd.addEventListener('change',()=>{if(cnumMode.value==='auto')refreshCertificateNumber()});updateCertNumberMode()}
function certCode(service){let n=(service||'').toLowerCase();if(n.includes('mesh'))return'MESH';if(n.includes('construction occupational'))return'COSH';if(n.includes('loss control'))return'LCMHIRAC';if(n.includes('safety officer 1'))return'BOSHSO1';if(n.includes('safety officer 2'))return'BOSHSO2';return'CERT'}
function generateCertificateNumber(service,date,excludeId=''){let year=(date||new Date().toISOString().slice(0,10)).slice(0,4),code=certCode(service),prefix=`1020-${code}-${year}-`,nums=db.certificates.filter(x=>x.id!==excludeId&&String(x.number||'').startsWith(prefix)).map(x=>parseInt(String(x.number).slice(prefix.length),10)).filter(Number.isFinite),next=Math.max(0,...nums)+1;return prefix+String(next).padStart(3,'0')}
function refreshCertificateNumber(){if(typeof cn==='undefined'||typeof cservice==='undefined'||typeof cd==='undefined')return;if(!cservice.value)return;cn.value=generateCertificateNumber(cservice.value,cd.value,'')}
function sc(e,id){e.preventDefault();let mode=cnumMode.value,number=mode==='manual'?cn.value.trim():generateCertificateNumber(cservice.value,cd.value,id||'');if(!number)return alert('Please enter a certificate number.');let c={id:id||eid(),number,pid:cp.value,service:cservice.value,tid:ctn.value,date:cd.value,expiry:ce.value,status:csx.value,remarks:cr.value,issuedBy:current?.name||'',numberMode:mode};if(db.certificates.some(x=>x.number===c.number&&x.id!==id))return alert('Certificate number already exists. Please use a different number.');if(id)db.certificates=db.certificates.map(x=>x.id==id?c:x);else db.certificates.push(c);save();closeM()}
function del(type,id){
  if(!can('admin','consultant'))return;
  if(type!=='participants'){
    if(confirm('Delete this record?')){db[type]=db[type].filter(x=>x.id!=id);save()}
    return;
  }
  let participant=db.participants.find(x=>x.id==id);if(!participant)return;
  let linkedCertificates=db.certificates.filter(c=>c.pid==id);
  let warning=linkedCertificates.length
    ?`Delete ${participant.name||'this participant'}? This will also permanently delete ${linkedCertificates.length} linked certificate record${linkedCertificates.length===1?'':'s'}.`
    :`Delete ${participant.name||'this participant'}? This action cannot be undone.`;
  if(!confirm(warning))return;

  // Approved requests normally recreate their participants during every render.
  // Remember an intentional deletion on the source request so it stays deleted.
  if(participant.sourceRequestId){
    let request=db.requests.find(r=>r.id==participant.sourceRequestId);
    if(request){
      let deleted=new Set(request.deletedParticipantKeys||[]);
      deleted.add(participantSyncKey(participant));
      request.deletedParticipantKeys=[...deleted];
    }
  }
  db.certificates=db.certificates.filter(c=>c.pid!=id);
  db.participants=db.participants.filter(x=>x.id!=id);
  save();
}

function findMatchingSchedule(service,date){
  let svc=cleanServiceName(service||'');
  return (db.schedules||[]).find(sc=>cleanServiceName(sc.service||'')===svc && date>=sc.startDate && date<=sc.endDate && String(sc.status||'Open').toLowerCase()!=='closed')||null;
}

function availableSchedulesForService(service=''){
  syncScheduleBookings();
  let svc=cleanServiceName(service||''),today=new Date().toISOString().slice(0,10);
  return (db.schedules||[])
    .filter(sc=>{
      if(svc && cleanServiceName(sc.service||'')!==svc)return false;
      if(String(sc.status||'Open').toLowerCase()==='closed')return false;
      if((sc.endDate||sc.startDate)<today)return false;
      let slots=Number(sc.slots||0),booked=Number(sc.booked||0);
      return !slots || booked<slots;
    })
    .sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||''));
}
function refreshAvailableDates(selectedDate='',selectedScheduleId=''){
  let select=$('rqDate'),help=$('rqDateHelp');
  if(!select)return;
  let service=$('rqService')?.value||'';
  let items=availableSchedulesForService(service);
  if(!items.length && service){
    // If the selected service has no schedule, show all available schedules so the client can choose another training.
    items=availableSchedulesForService('');
  }
  if(!items.length){
    select.innerHTML='<option value="">No available scheduled trainings</option>';
    if(help)help.textContent='No open training schedules are currently available. Please check the calendar or contact the administrator.';
    return;
  }
  let firstText=service?'Select available date':'Select an available scheduled training';
  select.innerHTML='<option value="">'+firstText+'</option>'+items.map(sc=>{
    let slots=Number(sc.slots||0),booked=Number(sc.booked||0),remain=slots?Math.max(0,slots-booked):'Unlimited';
    let dates=fmtDate(sc.startDate)+(sc.endDate&&sc.endDate!==sc.startDate?' – '+fmtDate(sc.endDate):'');
    let venue=sc.venue?' • '+esc(sc.venue):'';
    let serviceName=cleanServiceName(sc.service||'');
    let label=`${serviceName} • ${dates} — ${remain} slot${remain===1?'':'s'} available${venue}`;
    let chosen=(selectedScheduleId&&sc.id===selectedScheduleId)||(!selectedScheduleId&&selectedDate&&selectedDate>=sc.startDate&&selectedDate<=sc.endDate);
    return `<option value="${esc(sc.startDate)}" data-schedule-id="${esc(sc.id)}" data-service="${esc(serviceName)}" ${chosen?'selected':''}>${label}</option>`;
  }).join('');
  if(help)help.textContent=service?'Showing open schedules for the selected service. Full and closed schedules are hidden.':'All open schedules plotted by the admin are shown here. Selecting one will automatically choose its training/service.';
}
function selectScheduleFromDate(){
  let opt=rqDate.options[rqDate.selectedIndex];
  if(!opt||!opt.dataset.scheduleId)return;
  let sc=(db.schedules||[]).find(x=>x.id===opt.dataset.scheduleId);
  if(!sc)return;
  let opts=[...rqService.options];
  let match=opts.find(o=>cleanServiceName(o.textContent)===cleanServiceName(sc.service));
  if(match)rqService.value=match.value;
}
function syncScheduleBookings(){
  (db.schedules||[]).forEach(sc=>{
    let total=(db.requests||[]).filter(r=>{
      if(!['Pending','Approved'].includes(r.status))return false;
      if(r.scheduleId)return r.scheduleId===sc.id;
      return cleanServiceName(r.service||'')===cleanServiceName(sc.service||'') && r.date>=sc.startDate && r.date<=sc.endDate;
    }).reduce((sum,r)=>sum+Number(r.count||requestParticipantCount(r)||0),0);
    sc.booked=total;
  });
}

function setParticipantPhoto(input,index){
  let file=input.files?.[0];if(!file)return;
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){input.value='';return alert('Please upload a JPG, PNG, or WebP image.');}
  if(file.size>2*1024*1024){input.value='';return alert('Picture must be 2 MB or smaller.');}
  let reader=new FileReader();
  reader.onload=()=>{
    let card=document.querySelector(`.participant-entry[data-index="${index}"]`);
    if(!card)return;
    card.dataset.photo=reader.result;
    let img=card.querySelector('.participant-photo-preview');if(img)img.src=reader.result;
    input.removeAttribute('required');
  };
  reader.readAsDataURL(file);
}

function participantRecordFromRequest(p,r,client,registered){
  if(typeof p==='string'){
    return {name:p.trim(),company:r.company||client.company||'',contact:client.contact||'',email:client.email||'',position:'',registered};
  }
  return {
    name:participantFullName(p),
    lastName:p.lastName||'',firstName:p.firstName||'',middleName:p.middleName||'',suffix:p.suffix||'',
    gender:p.gender||'',birthdate:p.birthdate||'',
    company:p.company||r.company||client.company||'',
    position:p.position||'',
    companyAddress:p.companyAddress||'',region:p.region||'',industry:p.industry||'',
    companyEmail:p.companyEmail||'',personalEmail:p.personalEmail||'',
    personalMobile:p.personalMobile||'',companyLandline:p.companyLandline||'',
    photo:p.photo||'',
    contact:p.personalMobile||client.contact||'',
    email:p.personalEmail||p.companyEmail||client.email||'',
    registered
  };
}
function requestParticipants(r){
  if(Array.isArray(r.participants))return r.participants;
  return (r.notes||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
}


function safePhotoFilename(p){
  let name=[p.lastName,p.firstName,p.middleName,p.suffix].map(x=>String(x||'').trim()).filter(Boolean).join('_') || String(p.name||'participant');
  return name.replace(/[^a-z0-9_\-]+/gi,'_').replace(/_+/g,'_').replace(/^_|_$/g,'') || 'participant';
}

function submitRequest(e){
  e.preventDefault();if(role()!=='client')return;
  let participantList=participantFormData();
  if(!participantList.length)return alert('Please enter at least one participant.');
  if(participantList.some(p=>!p.lastName||!p.firstName||!p.middleName||!p.gender||!p.birthdate||!p.company||!p.position||!p.companyAddress||!p.region||!p.industry||!p.companyEmail||!p.personalEmail||!p.personalMobile||!p.photo)){
    return alert('Please complete all required information and upload a picture for every participant.');
  }
  syncScheduleBookings();
  let selectedOption=rqDate.options[rqDate.selectedIndex];
  let selectedScheduleId=selectedOption?.dataset?.scheduleId||'';
  let sc=(db.schedules||[]).find(x=>x.id===selectedScheduleId)||findMatchingSchedule(rqService.value,rqDate.value);
  if(!sc)return alert('Please select an available date from the schedule list.');
  if(sc){
    let remaining=Math.max(0,Number(sc.slots||0)-Number(sc.booked||0));
    if(Number(sc.slots||0)>0 && participantList.length>remaining)return alert(`Only ${remaining} slot${remaining===1?' is':'s are'} available for this schedule. Please reduce the number of participants or choose another schedule.`);
  }
  db.requests.push({
    id:eid(),clientId:current.id,clientName:current.name,company:current.company,
    type:rqType.value,service:rqService.value,date:rqDate.value,count:participantList.length,
    participants:participantList,
    notes:participantList.map(participantFullName).join('\n'),
    scheduleId:sc?.id||'',status:'Pending',created:new Date().toISOString()
  });
  syncScheduleBookings();save();e.target.reset();rqCount.value=1;renderParticipantForms();refreshAvailableDates();
  alert(`Request submitted successfully. ${participantList.length} slot${participantList.length===1?' has':'s have'} been reserved automatically.`);
}

function requestAction(id,status){
if(!can('admin','consultant'))return;
let r=db.requests.find(x=>x.id==id);if(!r)return;
if(status==='Approved' && r.status!=='Approved'){
  let items=requestParticipants(r);
  let client=users.find(u=>u.id===r.clientId)||{};
  let registered=(r.created||new Date().toISOString()).slice(0,10);
  items.forEach(item=>{
    let rec=participantRecordFromRequest(item,r,client,registered);
    if(!rec.name)return;
    let exists=db.participants.some(p=>(p.name||'').trim().toLowerCase()===rec.name.trim().toLowerCase() && (p.company||'').trim().toLowerCase()===(rec.company||'').trim().toLowerCase());
    if(exists){
      let existing=db.participants.find(p=>(p.name||'').trim().toLowerCase()===rec.name.trim().toLowerCase() && (p.company||'').trim().toLowerCase()===(rec.company||'').trim().toLowerCase());
      if(existing && rec.photo && !existing.photo)existing.photo=rec.photo;
    }else{
      rec.id=eid();
      rec.notes=`Added automatically from approved ${r.type||'service'} request${r.service?' — '+r.service:''}.`;
      rec.sourceRequestId=r.id;
      db.participants.push(rec);
    }
  });
}
r.status=status;
r.reviewedBy=current?.name||current?.username||'';
r.reviewedAt=new Date().toISOString();
syncScheduleBookings();
save();
if(status==='Approved'){
  alert(`${r.count||r.participants?.length||0} participant(s) have been added to the Participants list. A congratulatory email will now be prepared.`);
  sendApprovalEmail(r);
}
}
function sendApprovalEmail(r){
  let client=users.find(u=>u.id===r.clientId)||{};
  let to=(client.email||r.clientEmail||'').trim();
  if(!to){
    alert('Registration approved, but no client email address is saved. Please add an email to the client profile before sending the congratulatory email.');
    return;
  }
  let service=r.service||r.type||'training registration';
  let trainingDate=r.date?fmtDate(r.date):'the scheduled date';
  let count=Number(r.count||r.participants?.length||0);
  let clientName=r.clientName||client.name||'Client';

function cleanServiceName(v){return String(v||'').replace(/\s+—\s+₱[\d,]+.*$/,'').replace(/\s+—\s+TBD.*$/,'').trim()}
function scheduleStatus(sc){
  if(sc.status==='Closed')return'closed';

  if(slots>0&&booked>=slots)return'full';

function renderCalendar(){
  let box=$('dashboardCalendar');if(!box)return;
  let y=calendarCursor.getFullYear(),m=calendarCursor.getMonth();
  $('calendarMonthLabel').textContent=calendarCursor.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  if($('dashPlotBtn'))$('dashPlotBtn').style.display=role()==='admin'?'inline-block':'none';
  if($('calendarRoleHint'))$('calendarRoleHint').textContent=role()==='client'?'Click a schedule to view details and register.':'Available training schedules';
  let first=new Date(y,m,1),startDay=first.getDay(),days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();
  let html=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-head">${d}</div>`).join('');
  let today=new Date(),todayKey=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  for(let cell=0;cell<42;cell++){
    let dayNum=cell-startDay+1,cy=y,cm=m,display=dayNum,other=false;
    if(dayNum<1){other=true;display=prevDays+dayNum;cm=m-1;if(cm<0){cm=11;cy=y-1}}
    else if(dayNum>days){other=true;display=dayNum-days;cm=m+1;if(cm>11){cm=0;cy=y+1}}
    let key=`${cy}-${String(cm+1).padStart(2,'0')}-${String(display).padStart(2,'0')}`;
    let events=(db.schedules||[]).filter(sc=>key>=sc.startDate&&key<=sc.endDate);
    html+=`<div class="cal-day ${other?'other ':''}${key===todayKey?'today':''}"><div class="cal-date">${display}</div>${events.map(sc=>{
      let st=scheduleStatus(sc),label=cleanServiceName(sc.service),slots=Number(sc.slots||0),booked=Number(sc.booked||0),remain=slots?Math.max(0,slots-booked):'';
      return `<button type="button" class="cal-event ${st}" onclick="viewSchedule('${sc.id}')"><b>${esc(label)}</b>${slots?`<br>${remain} slot${remain===1?'':'s'} left`:''}</button>`
    }).join('')}</div>`
  }
  box.innerHTML=html;
  renderAdminScheduleList()
}

const SERVICE_PRICES = {
  "Mandatory Eight Hours Safety & Health (MESH)":2000,"MESH":2000,
  "Construction Occupational Safety & Health (COSH)":5000,"COSH":5000,
  "Loss Control Management with HiRAC":6500,"LCM + HiRAC":6500,
  "Basic Occupational Safety & Health (BOSH) SO1":2000,"BOSH SO1":2000,
  "Basic Occupational Safety & Health (BOSH) SO2":5000,"BOSH SO2":5000
};
function currentClientKey(){return (current&&((current.id)||current.username||current.email)) || ''}
function requestParticipantCount(r){
  if(Number(r.participantsCount||r.count||0)>0) return Number(r.participantsCount||r.count);
  let raw=r.participants||r.participantList||r.details||'';
  if(Array.isArray(raw)) return raw.length;
  if(typeof raw==='string') return raw.split(/\r?\n|,/).map(x=>x.trim()).filter(Boolean).length || 1;
  return 1
}
function requestServiceName(r){return r.service||r.training||r.trainingName||r.program||'Training Service'}
function serviceUnitPrice(service){
  let n=String(service||'').toUpperCase().replace(/\s+/g,' ').trim();
  if(n.includes('LCM') || n.includes('LOSS CONTROL')) return 6500;
  if(n.includes('BOSH') && (n.includes('SO1') || n.includes('SO 1'))) return 2000;
  if(n.includes('BOSH') && (n.includes('SO2') || n.includes('SO 2'))) return 5000;
  if(n.includes('COSH') || n.includes('CONSTRUCTION OCCUPATIONAL')) return 5000;
  if(n.includes('MESH') || n.includes('MANDATORY EIGHT HOURS')) return 2000;
  return SERVICE_PRICES[service]||0;
}
function requestAmountDue(r){
  let price=serviceUnitPrice(requestServiceName(r));
  return price*requestParticipantCount(r);
}
function getClientApprovedRequests(){
  let key=currentClientKey();
  return (db.requests||[]).filter(r=>{
    let mine=!r.clientId&&!r.clientUsername&&!r.clientEmail?true:(r.clientId===key||r.clientUsername===(current?.username||'')||r.clientEmail===(current?.email||''));
    return mine&&String(r.status||'').toLowerCase()==='approved'
  })
}
function populatePaymentRequests(){
  let sel=$('payRequest');if(!sel)return;
  let reqs=getClientApprovedRequests();
  sel.innerHTML='<option value="">Select approved request</option>'+reqs.map(r=>{
    let amount=requestAmountDue(r),count=requestParticipantCount(r),unit=serviceUnitPrice(requestServiceName(r));
    return `<option value="${esc(r.id)}">${esc(requestServiceName(r))} — ₱${unit.toLocaleString()} × ${count} participant${count===1?'':'s'} = ₱${amount.toLocaleString()}</option>`
  }).join('');
  if($('payDate'))$('payDate').value=new Date().toISOString().slice(0,10);
  updatePaymentAmount();renderClientPayments()
}
function updatePaymentAmount(){
  let sel=$('payRequest');if(!sel)return;
  let r=(db.requests||[]).find(x=>String(x.id)===String(sel.value)),due=r?requestAmountDue(r):0;
  if($('payDue'))$('payDue').value=due?due.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'';
  if($('payAmount'))$('payAmount').value=due?due.toFixed(2):''
}
let paymentProofPreviewUrl='';
function clearPaymentProof(){
  if(paymentProofPreviewUrl)URL.revokeObjectURL(paymentProofPreviewUrl);paymentProofPreviewUrl='';
  if($('payProof'))$('payProof').value='';
  if($('payProofPreview'))$('payProofPreview').removeAttribute('src');
  if($('payProofName'))$('payProofName').textContent='';
  if($('payProofSize'))$('payProofSize').textContent='';
  $('payProofPreviewWrap')?.classList.remove('show')
}
function previewPaymentProof(e){
  let file=e.target.files?.[0];if(!file)return clearPaymentProof();
  let allowed=['image/jpeg','image/png','image/webp'];
  if(!allowed.includes(file.type)){clearPaymentProof();return alert('Please upload a JPEG, PNG, or WebP image.');}
  if(file.size>5*1024*1024){clearPaymentProof();return alert('The payment proof must be 5 MB or smaller.');}
  if(paymentProofPreviewUrl)URL.revokeObjectURL(paymentProofPreviewUrl);
  paymentProofPreviewUrl=URL.createObjectURL(file);
  $('payProofPreview').src=paymentProofPreviewUrl;
  $('payProofName').textContent=file.name;
  $('payProofSize').textContent=`${(file.size/1024/1024).toFixed(2)} MB — ready to upload securely`;
  $('payProofPreviewWrap').classList.add('show')
}
async function submitPayment(e){
  e.preventDefault();let r=(db.requests||[]).find(x=>String(x.id)===String($('payRequest').value));
  if(!r)return alert('Please select an approved request.');
  let file=$('payProof')?.files?.[0];if(!file)return alert('Please upload a photo as proof of payment.');
  let payment={id:eid(),requestId:r.id,clientId:current?.id||'',clientUsername:current?.username||'',clientEmail:current?.email||'',clientName:current?.name||current?.contactPerson||'Client',company:current?.company||r.company||'',service:requestServiceName(r),participants:requestParticipantCount(r),amountDue:requestAmountDue(r),amountPaid:Number($('payAmount').value||0),method:$('payMethod').value,date:$('payDate').value,reference:$('payRef').value.trim(),notes:$('payNotes').value.trim(),status:'Pending Verification',createdAt:new Date().toISOString()};
  if(db.payments.some(p=>p.reference===payment.reference&&p.method===payment.method))return alert('This payment reference has already been submitted.');
  let submit=e.submitter||$('paySubmitButton'),original=submit?.textContent||'SUBMIT PAYMENT';if(submit){submit.disabled=true;submit.textContent='UPLOADING PROOF…'}
  try{
    if(!window.secureSubmitPayment)throw new Error('Secure payment upload is unavailable. Please refresh the page.');
    payment=await window.secureSubmitPayment(payment,file);
    db.payments.push(payment);render();
    alert('Payment and proof submitted. It is now pending Admin verification.');
    e.target.reset();clearPaymentProof();populatePaymentRequests()
  }catch(error){console.error(error);alert(error.message||'Payment submission failed. Please try again.');}
  finally{if(submit){submit.disabled=false;submit.textContent=original}}
}
function viewPaymentProof(id){
  let p=(db.payments||[]).find(x=>String(x.id)===String(id));
  if(!p?.proofPath)return alert('No payment proof is attached to this record.');
  return window.secureViewPaymentProof?.(p.proofPath,`${p.clientName||'Client'} — ${p.service||'Payment'}`)
}
function renderClientPayments(){
  let box=$('clientPayments');if(!box)return;let key=currentClientKey();
  let mine=(db.payments||[]).filter(p=>p.clientId===key||p.clientUsername===(current?.username||'')||p.clientEmail===(current?.email||''));
  box.innerHTML=mine.length?`<table class="table"><thead><tr><th>SERVICE</th><th>AMOUNT PAID</th><th>METHOD</th><th>REFERENCE</th><th>DATE</th><th>PROOF</th><th>STATUS</th></tr></thead><tbody>${mine.map(p=>`<tr><td>${esc(p.service)}</td><td>₱${Number(p.amountPaid||0).toLocaleString(undefined,{minimumFractionDigits:2})}</td><td>${esc(p.method)}</td><td>${esc(p.reference)}</td><td>${fmtDate(p.date)}</td><td>${p.proofPath?`<button class="btn gray action" onclick="viewPaymentProof('${esc(p.id)}')">View Photo</button>`:'—'}</td><td><b>${esc(p.status)}</b></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No payment records yet.</div>'
}
function renderAdminPayments(){
  let tb=$('paymentTable');if(!tb)return;
  tb.innerHTML=(db.payments||[]).length?(db.payments||[]).map(p=>`<tr><td><b>${esc(p.clientName||'Client')}</b><br><span class="small">${esc(p.company||'')}</span></td><td>${esc(p.service||'')}</td><td>₱${Number(p.amountPaid||0).toLocaleString(undefined,{minimumFractionDigits:2})}</td><td>${esc(p.method||'')}</td><td>${esc(p.reference||'')}</td><td>${fmtDate(p.date)}</td><td>${p.proofPath?`<button class="btn gray action" onclick="viewPaymentProof('${esc(p.id)}')">View Photo</button>`:'—'}</td><td><b>${esc(p.status||'')}</b></td><td>${p.status==='Pending Verification'?`<button class="btn primary action" onclick="verifyPayment('${p.id}')">Verify</button> <button class="btn red action" onclick="rejectPayment('${p.id}')">Reject</button>`:'<span class="small">Reviewed</span>'}</td></tr>`).join(''):'<tr><td colspan="9" class="empty">No payment submissions yet.</td></tr>'
}
function verifyPayment(id){
  if(!confirm('Verify this payment?'))return;let p=db.payments.find(x=>x.id==id);if(!p)return;
  p.status='Verified';p.reviewedAt=new Date().toISOString();p.reviewedBy=current?.name||'Admin';save();renderAdminPayments();alert('Payment verified.')
}
function rejectPayment(id){
  let reason=prompt('Reason for rejecting this payment:','Incorrect or unconfirmed payment details');if(reason===null)return;
  let p=db.payments.find(x=>x.id==id);if(!p)return;p.status='Rejected';p.rejectionReason=reason;p.reviewedAt=new Date().toISOString();p.reviewedBy=current?.name||'Admin';save();renderAdminPayments();alert('Payment rejected.')
}

function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x.database||x;if(!Array.isArray(d.participants)||!Array.isArray(d.certificates)||!Array.isArray(d.trainings))throw 0;db={participants:d.participants,certificates:d.certificates,trainings:d.trainings,requests:d.requests||[],payments:d.payments||[],schedules:d.schedules||[]};save();alert('Database restored successfully.')}catch{alert('Invalid backup file.')}};r.readAsText(f)}

if(type==='requests'){head=['Date','Client','Company','Type','Service','Available Date','Participants','Status','Details'];rows=(can('client')?db.requests.filter(r=>r.clientId===current.id):db.requests).map(r=>[(r.created||'').slice(0,10),r.clientName,r.company,r.type,r.service,r.date,r.count,r.status,r.notes])}
